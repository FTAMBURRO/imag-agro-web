kind = "web"
previewPath = "/"
title = "IMAG Agro"
description = "Sitio web premium para IMAG AGRO SAS: soluciones agropecuarias, asesoramiento, información para productores y contacto directo por WhatsApp."
version = "1.0.0"
id = "artifacts/imag-agro"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20569

[services.development]
run = "pnpm --filter @workspace/imag-agro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/imag-agro", "run", "build" ]
serve = "static"
publicDir = "artifacts/imag-agro/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20569"
BASE_PATH = "/"
